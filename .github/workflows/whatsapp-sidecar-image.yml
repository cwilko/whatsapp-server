name: Build WhatsApp MQTT sidecar image

# Builds wilkobets/whatsapp-sidecar from sidecar/ in this repository. Manual only: run it after changing the sidecar
# code, then bump the image tag in the Deployment (smart-home-config, workloads/whatsapp/deployment.yaml). Needs the
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push (use a new one each time, for example v0.1.0)
        required: true
        default: v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: wilkobets/whatsapp-sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # amd64 only: the Deployment is pinned to amd64 nodes.
      - uses: docker/build-push-action@v6
        with:
          context: sidecar
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
